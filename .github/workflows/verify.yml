name: Windows verification

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Isolated suites (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build and execute every isolated harness
        shell: pwsh
        run: |
          ./tools/Test-All.ps1 -Configuration ${{ matrix.configuration }} -TemporaryRoot "$env:RUNNER_TEMP/RE-Tests-${{ matrix.configuration }}" *>&1 |
            Tee-Object -FilePath verification.log
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.configuration }}
          path: verification.log
          if-no-files-found: warn
          retention-days: 14
